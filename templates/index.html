<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Clientes</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <main class="container">
        <section class="card">

            <header class="header">
                <div class="logo">DimDim</div>
                <h1>Cadastro de Clientes</h1>
                <p>Demonstração de deploy com Python Web (Flask) e Azure</p>
            </header>

            {% if mensagem %}
                <div class="mensagem" role="status">
                    {{ mensagem }}
                </div>
            {% endif %}

            <form method="POST" action="/">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite o nome do cliente"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        inputmode="numeric"
                        maxlength="14"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(11) 99999-9999"
                        autocomplete="tel"
                        required
                    >
                </div>

                <button type="submit">
                    Cadastrar cliente
                </button>

            </form>

            <footer class="observacao">
                Aplicação demonstrativa. Nenhum dado é armazenado
            </footer>

        </section>

        <p class="rodape">
            Projeto educacional · Python + Flask + Azure App Service
        </p>
    </main>
</body>
</html>
